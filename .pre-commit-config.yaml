exclude: '^\.claude/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # Committed pflow trace fixtures are Task-172 JSONL (one JSON object per line, .json extension —
      # matching production ~/.pflow/debug traces); the single-object JSON hooks can't parse them (#531).
      - id: check-json
        exclude: |
          (?x)^(
            \.devcontainer/devcontainer\.json|
            tests/fixtures/cache_analysis/.*\.json|
            \.taskmaster/tasks/task_159/baseline/_shared/fixtures/.*\.json
          )$
      - id: pretty-format-json
        exclude: |
          (?x)^(
            \.devcontainer/devcontainer\.json|
            tests/fixtures/cache_analysis/.*\.json|
            \.taskmaster/tasks/task_159/baseline/_shared/fixtures/.*\.json
          )$
        args: [--autofix, --no-sort-keys]
      - id: end-of-file-fixer
        exclude: \.md$
      - id: trailing-whitespace

  # Ruff runs from the uv-locked environment so pre-commit, `make check`, and a
  # bare `uv run ruff` all use the exact same version. A separately pinned
  # ruff-pre-commit rev drifted 4 minor versions behind uv.lock and silently
  # stopped enforcing rules that stabilized in newer ruff.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: local
    hooks:
      # Regenerates Codex assets (.agents/skills/*/SKILL.md) from their .claude/
      # sources so they can't go stale — the same invariant `make check` enforces,
      # moved earlier so a stale asset fails at commit instead of only in CI (the
      # failure this hook was added to prevent). always_run + no filenames because
      # the top-level `exclude: ^\.claude/` hides the source files from pre-commit's
      # list, and the script discovers them itself; it's ~0.1s so always-running is
      # free. See scripts/sync_claude_assets.py.
      - id: sync-claude-assets
        name: sync Claude→Codex reusable assets
        entry: uv run --frozen python scripts/sync_claude_assets.py --write
        language: system
        always_run: true
        pass_filenames: false

      # Catches ${...} templates leaking out of code blocks in docs — these
      # compile to live JS expressions and crash the page at render, a class
      # `mint validate` does not catch. See scripts/check_mdx_fences.py.
      - id: check-mdx-fences
        name: check MDX for leaked templates and unclosed fences
        entry: python3 scripts/check_mdx_fences.py
        language: system
        files: \.mdx$

      # Keeps a task's ## Status within the closed vocabulary the roadmap
      # tooling understands (not started | in progress | done | deprecated).
      # An off-vocabulary status is silently dropped from scripts/tasks counts
      # and listings. See scripts/check_task_status.py.
      - id: check-task-status
        name: validate taskmaster Status fields
        entry: python3 scripts/check_task_status.py
        language: system
        files: ^\.taskmaster/tasks/task_\d+/task-\d+\.md$
