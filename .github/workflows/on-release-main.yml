name: release-main

on:
  release:
    types: [published]

jobs:

  set-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Export tag without v prefix
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update project version
        run: |
          sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" pyproject.toml
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}

      - name: Upload updated pyproject.toml
        uses: actions/upload-artifact@v4
        with:
          name: pyproject-toml
          path: pyproject.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run tests
        run: uv run pytest -x -q

  publish:
    runs-on: ubuntu-latest
    needs: [set-version, test]
    permissions:
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Download updated pyproject.toml
        uses: actions/download-artifact@v4
        with:
          name: pyproject-toml

      # The web UI bundle (src/pflow/ui/static/) is gitignored and built here, not
      # committed. Without this step `uv build` would ship an EMPTY [ui] bundle and
      # `pflow ui` would 404 (Task 168 plan §Review Hardening H1). End users never
      # run Node — they install the prebuilt wheel produced below.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build UI bundle
        run: make ui-build

      # Fail loudly if the bundle is missing rather than letting `uv build`
      # silently ship an empty [ui] wheel (hatchling treats a zero-match
      # `artifacts` glob as a no-op, so this is the only guard).
      - name: Verify UI bundle is present
        run: test -f src/pflow/ui/static/index.html

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish --trusted-publishing always
