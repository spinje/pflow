name: release-main

on:
  release:
    types: [published]

jobs:

  set-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Export tag without v prefix
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update project version
        run: |
          sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" pyproject.toml
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}

      - name: Upload updated pyproject.toml
        uses: actions/upload-artifact@v4
        with:
          name: pyproject-toml
          path: pyproject.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run tests
        run: uv run pytest -x -q

  publish:
    runs-on: ubuntu-latest
    needs: [set-version, test]
    permissions:
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Download updated pyproject.toml
        uses: actions/download-artifact@v4
        with:
          name: pyproject-toml

      # The web UI bundle (src/pflow/ui/static/) is gitignored and built here, not
      # committed. Without this step `uv build` would ship an EMPTY [ui] bundle and
      # `pflow ui` would 404 (Task 168 plan §Review Hardening H1). End users never
      # run Node — they install the prebuilt wheel produced below.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build UI bundle
        run: make ui-build

      # Fast-fail before the build if `make ui-build` produced nothing (hatchling
      # treats a zero-match `artifacts` glob as a silent no-op). The post-build
      # check below is the real artifact-level guard.
      - name: Verify UI bundle is present
        run: test -f src/pflow/ui/static/index.html

      - name: Build package
        run: uv build

      # `uv build` builds the wheel FROM the sdist, so the bundle ships only if
      # BOTH hatch targets force-include it (pyproject [tool.hatch.build.targets.*]
      # artifacts). Inspect the real published artifact — the source-tree check
      # above cannot catch a wheel that built empty.
      - name: Verify built wheel contains the UI bundle
        run: |
          wheel=$(ls dist/*.whl)
          echo "Inspecting $wheel"
          if ! unzip -l "$wheel" | grep -q 'pflow/ui/static/index.html'; then
            echo "::error::Built wheel $wheel is missing the UI bundle (pflow/ui/static/) — the [ui] install would 404."
            exit 1
          fi

      - name: Publish package
        run: uv publish --trusted-publishing always
