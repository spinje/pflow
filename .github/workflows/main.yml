name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check typing
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # Exercise the same entry point contributors use. The Make target
        # owns the EncodingWarning environment inherited by xdist workers.
        run: make test-all-local PYTEST_WORKERS=2

      - name: Check typing
        run: uv run mypy

  # Summary job for branch protection — Linux-version and Windows-shard matrix
  # jobs have suffixed display names, so their bare names never resolve as
  # stable required checks. Point branch protection at this job; it gates both
  # matrices, Windows MCP smoke, and the macOS Make compatibility smoke test.
  tests-and-type-check-done:
    if: always()
    needs: [tests-and-type-check, tests-windows, tests-windows-mcp-smoke, tests-macos-make]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.tests-and-type-check.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.tests-windows.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.tests-windows-mcp-smoke.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.tests-macos-make.result }}" != "success" ]]; then
            exit 1
          fi

  # macOS ships an older GNU Make than Linux and Windows. Keep a focused
  # smoke test on the built-in Make so target-specific export syntax remains
  # compatible while the Linux matrix owns broad version coverage.
  tests-macos-make:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      - name: Run encoding canary through built-in Make
        run: |
          /usr/bin/make --version
          /usr/bin/make test PYTEST_WORKERS=2 'PYTEST=uv run python -m pytest tests/test_encoding_warning_net.py'

  # Task 116 Windows gate. Keep a single Python version because version-specific
  # bugs are rarely Windows-specific, but split the suite across two runners to
  # offset Windows process/filesystem overhead. The shards are exhaustive and
  # disjoint by construction: one owns core+CLI+nodes, the other owns tests/
  # minus those three directories, so newly added test areas cannot fall
  # through a hand-maintained manifest.
  tests-windows:
    name: tests-windows (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-cli-nodes
            pytest-targets: tests/test_core tests/test_cli tests/test_nodes
            run-mypy: true
          - shard: rest
            pytest-targets: tests --ignore=tests/test_core --ignore=tests/test_cli --ignore=tests/test_nodes
            run-mypy: false
    # ~8k tests at ~2x runner slowness should land well under this; the cap
    # exists so a hung test or subprocess can't burn a runner for the 6h default.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Exercise the shell implementation contributors actually install.
      # windows-latest also exposes Cygwin Bash, so relying on PATH would
      # silently test different path and HOME semantics from Git for Windows.
      PFLOW_BASH: C:\Program Files\Git\bin\bash.exe
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      - name: Install GNU Make
        shell: pwsh
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Verify Git Bash used by pflow
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:PFLOW_BASH -PathType Leaf)) {
            throw "Git Bash was not found at PFLOW_BASH=$env:PFLOW_BASH"
          }
          & $env:PFLOW_BASH --version

      - name: Run tests through native Windows Make
        # Force cmd.exe so Git Bash on the runner cannot hide Windows recipe
        # incompatibilities. This reproduces the contributor path that caught
        # the original regression.
        shell: pwsh
        env:
          # Keep timing evidence in the job log while benchmarking four workers.
          PYTEST_ADDOPTS: --durations=25
        run: >-
          make SHELL=cmd.exe .SHELLFLAGS=/C test-all-local PYTEST_WORKERS=4
          "PYTEST=uv run python -m pytest ${{ matrix.pytest-targets }}"

      # LOAD-BEARING, not incidental: ubuntu mypy treats `sys.platform ==
      # "win32"` branch bodies as statically unreachable and never
      # type-checks them. This run is the ONLY static check the win32-only
      # code this task adds (shell node bash resolution, win32 stdin
      # detection, server creationflags) ever gets. `!cancelled()` so a red
      # test step doesn't mask this signal during green-up iteration.
      - name: Check typing
        if: ${{ !cancelled() && matrix.run-mypy }}
        run: uv run mypy

  # Keep the network-dependent MCP spawn proof off the Windows test critical
  # path. The summary job still gates it, but it runs in parallel with pytest.
  tests-windows-mcp-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      # Closes the one MCP assumption CI can close (task-116.md "Assumed
      # correct" item): the mcp SDK resolving `npx` through its Windows
      # `.cmd` shim when spawning a stdio server. A CI step, not an e2e test,
      # so local `make test-e2e` never grows a node/npx + network dependency.
      - name: 'MCP smoke: npx stdio server spawns on Windows'
        timeout-minutes: 10
        run: |
          npx --version
          uv run pflow mcp add '{"mcpServers":{"everything":{"command":"npx","args":["-y","@modelcontextprotocol/server-everything"]}}}'
          uv run pflow mcp sync everything
