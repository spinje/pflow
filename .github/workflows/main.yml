name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check typing
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # Exercise the same entry point contributors use. The Make target
        # owns the EncodingWarning environment inherited by xdist workers.
        run: make test-all-local PYTEST_WORKERS=2

      - name: Check typing
        run: uv run mypy

  # Real-pip installability of the wheel we publish. Rationale, measurements, and
  # the full list of deliberate choices: GH #603.
  #
  # NOT redundant with tests-and-type-check: that matrix installs via
  # `uv sync --frozen`, which never re-checks a dependency's Requires-Python, and
  # uv ignores Requires-Python UPPER bounds by design. Only real pip catches it.
  #
  # Three things here are load-bearing — do not "simplify" them:
  #   - install the BUILT WHEEL, not `pip install pflow-cli` (no older release for
  #     pip to silently backtrack to, so a bad pin fails loudly)
  #   - never use uv for the install step (it would pass unconditionally)
  #   - never add a pip cache; pip caches index responses, so a warm cache can
  #     agree with a stale view of PyPI while real installs fail (hit while
  #     diagnosing #602). The cold download IS the check.
  #
  # 3.14 is deliberately absent — the one interpreter where pip is known to fail
  # (litellm==1.86.1 caps Requires-Python <3.14), so the leg would be red on
  # arrival. Add "3.14" when the litellm pin moves; that leg going green is the
  # acceptance criterion for GH #602. Do not paper it over by relaxing this job.
  pip-install-smoke:
    name: pip-install-smoke (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Same reasoning as tests-windows' cap: a required check must not be able to
    # burn a runner for the 6h default. The one plausible hang here is a stalled
    # PyPI download, and the job is measured at ~40s, so this is ~14x headroom.
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Deliberately NOT ./.github/actions/setup-python-env — that composite runs
      # `uv sync --frozen` and installs a dev toolchain this job never touches.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.6.14"

      # Plain `uv build` (sdist -> wheel), NOT `uv build --wheel` — this is the path
      # the release workflow uses, so the artifact under test matches the published
      # one. METADATA is identical either way, but the sdist's `exclude` entry for
      # CLAUDE.md matches by basename recursively, so `--wheel` would test a file set
      # we never ship. Also emits an sdist; the glob below still matches one wheel.
      - name: Build the wheel
        run: uv build --out-dir dist

      - name: Install the wheel with real pip
        # stdlib venv + real pip (see the load-bearing list above). `--upgrade pip`
        # keeps the resolver current, so the signal matches what users actually run.
        run: |
          python -m venv /tmp/pip-smoke
          /tmp/pip-smoke/bin/python -m pip install --no-cache-dir --upgrade pip
          /tmp/pip-smoke/bin/python -m pip install --no-cache-dir dist/*.whl

      - name: Verify the installed CLI runs
        # `--version` / `--help` exercise the click layer and already pull mcp,
        # starlette, uvicorn and httpx — but NOT litellm or claude_agent_sdk, which
        # are deliberately lazy (tests/test_cli/test_lazy_imports.py). Without the
        # third line a wheel that installs cleanly and then dies on first real LLM
        # call would pass. Import them through pflow's own seam: a bare
        # `import litellm` makes a 5s-timeout cost-map fetch to GitHub, which
        # import_litellm() avoids by setting LITELLM_LOCAL_MODEL_COST_MAP first.
        run: |
          /tmp/pip-smoke/bin/pflow --version
          /tmp/pip-smoke/bin/pflow --help > /dev/null
          /tmp/pip-smoke/bin/python -c "import pflow.nodes.agent.claude_backend; from pflow.core.litellm_runtime import import_litellm; import_litellm()"

  # Summary job for branch protection — Linux-version, Windows-shard, and
  # pip-install-smoke matrix jobs have suffixed display names, so their bare
  # names never resolve as stable required checks. Point branch protection at
  # this job; it gates all three matrices, Windows MCP smoke, and the macOS Make
  # compatibility smoke test.
  tests-and-type-check-done:
    if: always()
    # Every job listed here needs a matching result check below. `if: always()` means
    # a missing check silently un-gates that job: it gets waited on, its result is
    # never inspected, and this job still exits 0.
    needs: [tests-and-type-check, tests-windows, tests-windows-mcp-smoke, tests-macos-make, pip-install-smoke]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.tests-and-type-check.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.tests-windows.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.tests-windows-mcp-smoke.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.tests-macos-make.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.pip-install-smoke.result }}" != "success" ]]; then
            exit 1
          fi

  # macOS ships an older GNU Make than Linux and Windows. Keep a focused
  # smoke test on the built-in Make so target-specific export syntax remains
  # compatible while the Linux matrix owns broad version coverage.
  tests-macos-make:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      - name: Run encoding canary through built-in Make
        run: |
          /usr/bin/make --version
          /usr/bin/make test PYTEST_WORKERS=2 'PYTEST=uv run python -m pytest tests/test_encoding_warning_net.py'

  # Task 116 Windows gate. Keep a single Python version because version-specific
  # bugs are rarely Windows-specific, but split the suite across two runners to
  # offset Windows process/filesystem overhead. The shards are exhaustive and
  # disjoint by construction: one owns core+CLI+nodes, the other owns tests/
  # minus those three directories, so newly added test areas cannot fall
  # through a hand-maintained manifest.
  tests-windows:
    name: tests-windows (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-cli-nodes
            pytest-targets: tests/test_core tests/test_cli tests/test_nodes
            run-mypy: true
          - shard: rest
            pytest-targets: tests --ignore=tests/test_core --ignore=tests/test_cli --ignore=tests/test_nodes
            run-mypy: false
    # ~8k tests at ~2x runner slowness should land well under this; the cap
    # exists so a hung test or subprocess can't burn a runner for the 6h default.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Exercise the shell implementation contributors actually install.
      # windows-latest also exposes Cygwin Bash, so relying on PATH would
      # silently test different path and HOME semantics from Git for Windows.
      PFLOW_BASH: C:\Program Files\Git\bin\bash.exe
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      - name: Install GNU Make
        shell: pwsh
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Verify Git Bash used by pflow
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:PFLOW_BASH -PathType Leaf)) {
            throw "Git Bash was not found at PFLOW_BASH=$env:PFLOW_BASH"
          }
          & $env:PFLOW_BASH --version

      - name: Run tests through native Windows Make
        # Force cmd.exe so Git Bash on the runner cannot hide Windows recipe
        # incompatibilities. This reproduces the contributor path that caught
        # the original regression.
        shell: pwsh
        env:
          # Keep timing evidence in the job log while benchmarking four workers.
          PYTEST_ADDOPTS: --durations=25
        run: >-
          make SHELL=cmd.exe .SHELLFLAGS=/C test-all-local PYTEST_WORKERS=4
          "PYTEST=uv run python -m pytest ${{ matrix.pytest-targets }}"

      # LOAD-BEARING, not incidental: ubuntu mypy treats `sys.platform ==
      # "win32"` branch bodies as statically unreachable and never
      # type-checks them. This run is the ONLY static check the win32-only
      # code this task adds (shell node bash resolution, win32 stdin
      # detection, server creationflags) ever gets. `!cancelled()` so a red
      # test step doesn't mask this signal during green-up iteration.
      - name: Check typing
        if: ${{ !cancelled() && matrix.run-mypy }}
        run: uv run mypy

  # Keep the network-dependent MCP spawn proof off the Windows test critical
  # path. The summary job still gates it, but it runs in parallel with pytest.
  tests-windows-mcp-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"

      # Closes the one MCP assumption CI can close (task-116.md "Assumed
      # correct" item): the mcp SDK resolving `npx` through its Windows
      # `.cmd` shim when spawning a stdio server. A CI step, not an e2e test,
      # so local `make test-e2e` never grows a node/npx + network dependency.
      - name: 'MCP smoke: npx stdio server spawns on Windows'
        timeout-minutes: 10
        run: |
          npx --version
          uv run pflow mcp add '{"mcpServers":{"everything":{"command":"npx","args":["-y","@modelcontextprotocol/server-everything"]}}}'
          uv run pflow mcp sync everything
