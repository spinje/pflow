name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # Use -n 2 for CI (conservative for 2-core GitHub runners)
        run: uv run python -m pytest -n 2 --doctest-modules --ignore=tests/test_nodes/test_llm/test_llm_integration.py

      - name: Check typing
        run: uv run mypy

  # Summary job for branch protection — matrix jobs report as
  # "tests-and-type-check (3.10)" etc., so the bare name never resolves.
  # Point the required status check at this job instead.
  tests-and-type-check-done:
    if: always()
    needs: tests-and-type-check
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.tests-and-type-check.result }}" != "success" ]]; then
            exit 1
          fi
