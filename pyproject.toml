[project]
name = "pflow-cli"
version = "0.15.0"
description = "Reusable CLI workflows from shell, LLM, HTTP, and MCP nodes"
authors = [{ name = "Andreas Falcone", email = "andreas@pflow.run" }]
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
keywords = ["workflow", "cli", "automation", "llm", "mcp", "ai-agent", "agent-skill"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1,<8.2", # CLI framework (more flexible than Typer). Self-pinned to 8.1.x to DECOUPLE the click 8.x migration from the litellm bump: litellm 1.86.1 relaxed its transitive click constraint to <9.0, so without this ceiling uv would resolve click to 8.3.x — which removed CliRunner's mix_stderr kwarg, flipped stream-merging defaults (breaking ~128 mix_stderr=False sites + ~160 bare CliRunner() output assertions), and changed subgroup empty-invocation exit codes (0→2). Removing this ceiling is the job of GH #426 (click 8.x migration). <8.2 not <8.3 because 8.1.x is the only line empirically confirmed green.
    "jsonschema>=4.20.0", # JSON Schema validation for workflow IR
    "referencing>=0.28.4", # Offline JSON Schema reference registry for self-contained LLM output_schema validation
    "pydantic", # IR/metadata validation
    "mcp[cli]>=1.17.0", # Model Context Protocol for MCP server support
    "requests>=2.32.5", # HTTP requests library for HttpNode (2.32.5 fixes SSLContext regression). Slated for removal in favor of httpx — see GH #422.
    "claude-agent-sdk>=0.2.82", # Claude Agent SDK for agentic development node (>=0.2.82 for native structured output via output_format + ResultMessage.structured_output)
    "PyYAML>=6.0.0", # YAML parsing for markdown workflow format params and frontmatter
    "litellm==1.86.1", # Provider-unified LLM client (the sole LLM seam — see src/pflow/core/llm_client.py and src/pflow/core/litellm_runtime.py). Pinned exactly because the bundled pricing-map backup is the determinism contract (LITELLM_LOCAL_MODEL_COST_MAP=True in litellm_runtime.py): the snapshot in this wheel must contain claude-opus-4-7 so offline cache-analysis stays reproducible, and bumping refreshes which models are "built-in" priced. Note: 1.86.1 RELAXED litellm's transitive click constraint to <9.0 (1.83.x hard-pinned click==8.1.8); click is now held at 8.1.x by pflow's own ceiling above — see GH #426 for the click 8.x migration. See GH #384 (offline pricing map) and GH #368 (Opus 4.7 reasoning_effort, fixed alongside this bump).
    "openai>=1.0", # Already a transitive dep via litellm; declared directly because the LLM adapter catches `openai.OpenAIError` (the real base of LiteLLM's exception hierarchy — see src/pflow/core/llm_client.py). 1.0 is the floor where the modern openai exception hierarchy stabilized.
    "httpx>=0.18", # Already a transitive dep via litellm; declared directly because src/pflow/core/litellm_runtime.py::ensure_model_priced calls httpx.get on cost-map miss to fetch the upstream model_cost JSON. This bypasses litellm.get_model_cost_map, which honors LITELLM_LOCAL_MODEL_COST_MAP=True (set by pflow) and would short-circuit a URL-form fetch to the bundled backup. 0.18 is the floor for raise_for_status + .json() + scalar timeout — the only httpx surface we use. GH #422 tracks consolidating HttpNode onto httpx so this becomes the only declared HTTP library.
]

[project.optional-dependencies]
# Web UI server (`pflow ui`, Task 168). NOTE: starlette + uvicorn are ALSO
# pulled transitively by mcp[cli] today, so this extra adds no new wheel in
# practice — but a feature must declare its own direct deps rather than lean on
# another feature's transitive ones. The frontend bundle ships separately under
# src/pflow/ui/static/ (built at release by `make ui-build`, gitignored in source).
ui = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
pflow = "pflow.cli:cli_main"

[project.urls]
Homepage = "https://pflow.run"
Repository = "https://github.com/spinje/pflow"
Documentation = "https://docs.pflow.run"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pytest-xdist>=3.2.0",
    "pre-commit>=2.20.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tox-uv>=1.11.3",
    "deptry>=0.23.0",
    "mypy>=0.991",
    "ruff>=0.15.0",
    "PyYAML>=6.0.0",
    "types-PyYAML>=6.0.0",
    "types-jsonschema>=4.25.0.20250809",
    "types-requests>=2.32.4.20250809",
    "starlette>=0.40",  # `pflow ui` server + Starlette TestClient (tests/test_cli/test_ui.py)
    "uvicorn>=0.30",  # `pflow ui` server runtime
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    ".cursor/",
    ".github/",
    ".taskmaster/",
    "architecture/",
    "assets/",
    "docs/",
    "examples/",
    "releases/",
    "scratchpads/",
    "scripts/",
    "tests/",
    ".pre-commit-config.yaml",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "Makefile",
    "SECURITY.md",
    "tox.ini",
    "uv.lock",
]
# The web UI bundle (src/pflow/ui/static/, Task 168) is gitignored, so hatchling
# excludes it from the sdist by default. `uv build` and `make build` build the
# wheel FROM the sdist, so the wheel-target force-include below is silently
# dropped (the sdist had no bundle to copy) and the published [ui] wheel ships
# EMPTY → `pflow ui` 503s. This line must mirror the wheel target's `artifacts`.
# Pinned by tests/test_packaging.py + a post-build wheel check in release CI.
artifacts = ["src/pflow/ui/static/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/pflow"]
# The web UI bundle (Task 168) is a build artifact: gitignored, produced by
# `make ui-build` at release time. Hatchling honors .gitignore by default, so
# without this it would EXCLUDE src/pflow/ui/static/ from the wheel and ship an
# empty [ui] bundle (`pflow ui` would 404 — plan §Review Hardening H1).
# `artifacts` force-includes VCS-ignored build outputs. MUST be mirrored on the
# sdist target above — `uv build`/`make build` build the wheel from the sdist.
artifacts = ["src/pflow/ui/static/**/*"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["scripts/debug", ".claude", "scratchpads"]

[[tool.mypy.overrides]]
module = "pflow.pocketflow.*"
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "serial: marks tests that must run sequentially (deselect with '-m \"not serial\"')",
    "integration: marks cross-component integration tests (rarely used; subprocess/pipe tests use the e2e marker)",
    "e2e: marks real process, shell, pipe, or external-boundary tests",
    "paid: marks tests that can incur provider charges and must be explicitly selected",
    "trace_files: allows tests to write workflow trace JSON files",
    "no_fake_llm_keys: disable the autouse fake-LLM-key injection (for tests asserting the missing-key code path)",
]
# Note: We don't set addopts with -n here to allow flexibility
# Use 'make test' for parallel or 'make test-debug' for sequential
# PEP 597 net (Task 116): any text-mode open()/read_text()/write_text()/fdopen
# without encoding= is a hard error — in src, tests, and code-node snippets
# alike. ruff PLW1514 catches most sites statically but has blind spots
# (os.fdopen, paths derived from untyped fixture params like a bare tmp_path);
# this filter is the runtime backstop. It only fires when the interpreter runs
# with PYTHONWARNDEFAULTENCODING=1, exported by the Makefile test targets as an
# env var so pytest-xdist workers inherit it. litellm ships its own
# encoding-less opens (warning attribution follows the DEFINING module of the
# frame that calls open(), so they're cleanly separable) — ignored below.
# Canary: tests/test_encoding_warning_net.py fails loudly if the net dies.
filterwarnings = [
    "error::EncodingWarning",
    "ignore::EncodingWarning:litellm.*",
]

[tool.ruff]
# target-version is inferred from requires-python (>=3.10) — do not pin it separately.
line-length = 120
exclude = [
    "src/pflow/pocketflow/*",
    "tests/pocketflow/*",
    "scripts/*",
    ".claude/*",
    ".taskmaster/*",
    "scratchpads/*",
    "examples/*",
]

[tool.ruff.lint]
# Task 116 (Windows compat): PLW1514 (unspecified-encoding) is a preview-only
# rule in ruff 0.15.0 — `explicit-preview-rules` limits preview status to
# rules named explicitly in `select` rather than enabling the entire preview
# rule set (which would pull in unrelated, unreviewed lint findings).
preview = true
explicit-preview-rules = true
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-logging
    "LOG",
    # flake8-print
    "T20",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
    # unspecified-encoding (Task 116, Windows compat: locale defaults to cp1252 there)
    "PLW1514",
]
ignore = [
    # Single-line implicit string concatenation — conflicts with ruff format
    "ISC001",
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Avoid specifying long messages outside the exception class
    "TRY003",
    # Consider moving return statement to else block
    "TRY300",
    # Abstract raise to an inner function
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
# Tests are a different context: asserts are the point (S101) and print is fine (T20).
"tests/*" = ["S101", "T20"]
"tests/test_core/test_stdin_no_hang.py" = ["S603", "S607", "UP022"]  # Allow subprocess calls for testing stdin hang issue
"src/pflow/nodes/shell/shell.py" = ["S602", "S603"]  # shell=True is intentional for shell node; S603 is the win32 list-form equivalent (["bash", "-c", cmd] via Git Bash, ADR-0013)
"src/pflow/core/prompt_cache_analysis/*" = ["RUF001", "RUF002"]  # `×` (multiplication sign) is spec-mandated for agent-facing output: `(×N)` batch annotation, `0.1×`/`1.25×`/`2×` cost ratios.

[tool.ruff.format]
preview = true

[tool.deptry.per_rule_ignores]
DEP002 = [
    "PyYAML",  # PyYAML used by markdown parser via lazy import.
    "litellm", # litellm is imported via importlib.import_module("litellm") through pflow.core.litellm_runtime (see GH #384 — deterministic offline pricing-map default). deptry can't see runtime string imports.
]
