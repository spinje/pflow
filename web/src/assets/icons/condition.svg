<svg viewBox="0 -12 192 187" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Condition glyph: one hollow ring in (orange), two hollow rings out (white),
       legs blending orange -> white (the same source->target idea as the canvas's
       gradient edges). The flip is BAKED into the path coords (no transform) so the
       objectBoundingBox gradient axis reads naturally; cores are true evenodd HOLES
       (transparent - the tile bg shows through, nothing hardcoded). The enlarged top
       ring is a stroked circle (r32 +/- 8 = outer 40 / inner 24, matching the r24
       hole). Legs are visible from y~72 (under the r40 ring) to y=111: the gradient
       stops (0.41 -> 0.62 of the 175-tall path bbox) span exactly that run, so the
       out-rings stay pure white. Orange = CONDITION_COLOR (utils/format.ts). -->
  <defs>
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.41" stop-color="#ffa657"/>
      <stop offset="0.62" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
