  <circle cx="11" cy="11" r="3" fill="#e26ad8"/>
  <circle cx="21" cy="16" r="3" fill="#e26ad8"/>
  <circle cx="11" cy="21" r="3" fill="#e26ad8"/>
  <path d="M13.5 12.2 L18.5 14.8 M13.5 19.8 L18.5 17.2" stroke="#e26ad8" stroke-width="2" stroke-linecap="round"/>
</svg>
