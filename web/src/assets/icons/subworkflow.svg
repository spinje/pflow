<!-- Sub-workflow glyph: a frame containing a mini flow (three wired nodes), a
     workflow-in-a-box, which is literally what the node is. Stroke/fill are the
     workflow kind magenta; keep equal to KIND_COLORS.workflow in utils/format.ts
     (#e26ad8) so tile border, category line, edges, and icon speak one color.
     NOTE: no double hyphen in this comment, it is illegal XML. -->
